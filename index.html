<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/6.6.6/css/flag-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap');

        :root {
            --f1-red: #e10600;
            --bg-dark: rgba(10, 10, 10, 0.98);
            --border-grey: #2a2a2a;
            --widget-bg: rgba(255, 255, 255, 0.02);
            --text-main: #ffffff;
            --text-dim: #999;
            --purple-fastest: #b138ff;
            --t-mercedes: #27F4D2;
            --t-ferrari: #E8002D;
            --t-redbull: #3671C6;
            --t-williams: #64CFF0;
            --t-aston: #229971;
            --t-alpine: #0093CC;
            --t-rb: #6692FF;
            --t-haas: #B6BABD;
            --t-mclaren: #FF8000;
            --t-sauber: #00E701;
        }

        body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: sans-serif;
            color: var(--text-main);
            text-transform: uppercase;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        .f1-top-tab {
            position: absolute;
            bottom: 270px;
            left: 0;
            height: 55px;
            width: 380px;
            background: #111;
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-top: 4px solid var(--f1-red);
            z-index: 20;
        }

        .f1-top-tab .logo {
            font-weight: 900;
            font-size: 38px;
            color: var(--f1-red);
            font-style: italic;
            margin-right: 25px;
        }

        .f1-top-tab .session {
            font-weight: 700;
            font-size: 18px;
            margin-right: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            background: #555;
        }

        .status-online {
            background: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .hud-main-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 270px;
            background: var(--bg-dark);
            border: none;
            border-top: 1px solid var(--border-grey);
            border-radius: 0;
            display: grid;
            grid-template-columns: 380px 1fr 340px 420px;
            overflow: hidden;
            z-index: 10;
        }

        .section {
            border-right: 1px solid var(--border-grey);
            position: relative;
            padding: 35px 15px 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .section-label span {
            color: var(--f1-red);
        }

        .widget-box {
            background: var(--widget-bg);
            border: 1px solid #222;
            border-radius: 4px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LEADERBOARD */
        .lb-row {
            display: flex;
            align-items: center;
            height: 21px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 1px;
            width: 100%;
            gap: 5px;
        }

        .lb-row.player {
            background: linear-gradient(90deg, rgba(225, 6, 0, 0.45) 0%, transparent 100%);
            border-left: 3px solid var(--f1-red);
            padding-left: 3px;
        }

        .lb-row.divider {
            height: 8px;
            justify-content: center;
            opacity: 0.4;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .lb-pos {
            width: 20px;
            text-align: right;
            font-size: 11px;
            color: var(--text-dim);
        }

        .lb-team-bar {
            width: 3px;
            height: 14px;
            border-radius: 2px;
            background: #fff;
            flex-shrink: 0;
        }

        .lb-team-logo {
            width: 24px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
            opacity: 1;
            align-self: center;
        }

        .lb-name {
            flex: 1;
            padding-left: 4px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .lb-tyre {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .lb-val {
            width: 78px;
            text-align: right;
            font-family: sans-serif;
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 600;
            color: #ccc;
            white-space: nowrap;
        }

        .lb-val.fastest {
            color: var(--purple-fastest);
        }

        .lb-val.lapped {
            color: #888;
        }

        /* RACE CONTROL GRID */
        .rc-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }

        .rc-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .w-label {
            font-size: 9px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .w-val {
            font-size: 22px;
            font-weight: 800;
            line-height: 1;
        }

        .w-sub {
            font-size: 10px;
            color: #666;
            font-weight: 700;
            margin-top: 2px;
        }

        .fuel-bar {
            width: 65%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .fuel-fill {
            height: 100%;
            background: #ffd700;
            transition: width 0.3s;
        }

        /* TELEMETRY & TYRES */
        .tel-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 5px;
        }

        .tel-unit .v {
            font-size: 40px;
            font-weight: 800;
            line-height: 1;
            text-align: center;
        }

        .tel-unit .l {
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
        }

        .t-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .t-bar-bg {
            flex: 1;
            height: 5px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }

        .t-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.05s linear;
        }

        .tyre-mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 100%;
            margin-top: 5px;
        }

        .tyre-mini-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            padding: 2px 5px;
            border-radius: 2px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .tyre-mini-box.hot {
            color: var(--f1-red);
            border-color: var(--f1-red);
        }

        /* CAMERA 16:9 */
        .camera {
            border-right: none;
            padding: 45px 15px 15px 15px;
        }

        .cam-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cam-label {
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-size: 11px;
            font-weight: 900;
            color: #444;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rec-dot {
            width: 6px;
            height: 6px;
            background: var(--f1-red);
            border-radius: 50%;
        }

        .t-ico {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
        }

        .t-S {
            border-color: #ff2a2a;
            color: #ff2a2a;
        }

        .t-M {
            border-color: #ffd700;
            color: #ffd700;
        }

        .t-H {
            border-color: #ffffff;
            color: #ffffff;
        }

        .t-I {
            border-color: #00cc44;
            color: #00cc44;
        }

        .t-W {
            border-color: #4488ff;
            color: #4488ff;
        }

        /* ERS stacked — compact */
        .ers-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .ers-header-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
        }

        .ers-mode-badge {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            padding: 1px 4px;
            font-size: 8px;
            color: #ffd700;
            margin-left: auto;
        }

        .ers-bar-row {
            display: flex;
            align-items: center;
            gap: 5px;
            line-height: 1;
        }

        .ers-bar-label {
            width: 22px;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .ers-bar-bg {
            flex: 1;
            height: 4px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }

        .ers-pct {
            width: 24px;
            text-align: right;
            font-size: 8px;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        #lb-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-top: 2px;
        }

        .lb-row {
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid transparent;
            padding: 0 4px;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <div class="f1-top-tab">
        <div id="status-dot" class="status-dot"></div>
        <img src="resources/f1-logo.svg" style="height:22px; margin-right:20px;">
        <div class="session" id="top-session">LIVE</div>
        <div style="font-size: 14px; font-weight: 800; color: var(--text-dim);">LAP <span id="top-lap"
                style="color:#fff">--/--</span></div>
    </div>

    <div class="hud-main-bar">
        <div class="section">
            <div class="section-label"><span>//</span> <span id="lb-mode">INTERVAL</span> <span>//</span></div>
            <div id="lb-list"></div>
        </div>

        <div class="section">
            <div class="section-label"><span>//</span> RACE CONTROL <span>//</span></div>

                    <div class="widget-box">

                    <div class="widget-box">
                        <div class="w-label">DRS</div>
                        <div class="w-val" id="r-drs" style="color:#555">OFF</div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">PISTA</div>
                        <div class="w-val" id="r-temp">--°C</div>
                        <div class="w-sub">☀ TEMPERATURA</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-label"><span>//</span> TELEMETRIA <span>//</span></div>
            <div class="tel-stats">
                <div class="tel-unit">
                    <div class="v" id="t-gear">N</div>

                </div>
            </div>
            <div class="ers-stack">
                <div class="ers-header-row">
                    ERS
                    <span class="ers-mode-badge" id="ers-mode">NONE</span>
                </div>
                <div class="ers-bar-row">
                    <span class="ers-bar-label">BATT</span>
                    <div class="t-bar-bg">
                        <div id="b-ers" class="t-bar-fill" style="background:#ffd700"></div>
                    </div>
                    <span class="ers-pct" id="ers-pct">0%</span>
                </div>
                <div class="ers-bar-row">
                    <span class="ers-bar-label">LAP</span>
                    <div class="t-bar-bg">
                        <div id="b-ers-lap" class="t-bar-fill" style="background:#00ff00"></div>
                    </div>
                    <span class="ers-pct" id="ers-lap-pct">0%</span>

            </div>
            <div class="t-bar-row"><span>THR</span>

                    <div id="b-thr" class="t-bar-fill" style="background:#00ff00"></div>

            <div class="tyre-mini-grid">

                <div class="tyre-mini-box" id="box-fr"><span>FR</span><div><span id="w-fr" style="color:#888; font-size:9px; margin-right:4px;">0%</span><span id="v-fr">--</span></div></div>
                <div class="tyre-mini-box" id="box-rl"><span>RL</span><div><span id="w-rl" style="color:#888; font-size:9px; margin-right:4px;">0%</span><span id="v-rl">--</span></div></div>
                <div class="tyre-mini-box" id="box-rr"><span>RR</span><div><span id="w-rr" style="color:#888; font-size:9px; margin-right:4px;">0%</span><span id="v-rr">--</span></div></div>

                    style="width:80px; opacity:0.05">
                <div class="cam-label">LIVE FEED <div class="rec-dot"></div>
                </div>
            </div>
        </div>

    <script>
        let ws = null;
        let reconnectDelay = 3000;
        let reconnectTimer = null;

        function connect() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                clearTimeout(reconnectTimer);
                reconnectDelay = 3000;
                const dot = document.getElementById('status-dot');
                if (dot) { dot.style.background = '#00ff00'; dot.style.boxShadow = '0 0 8px #00ff00'; }
                console.log('WebSocket connected');
            };

            ws.onclose = () => {
                const dot = document.getElementById('status-dot');
                if (dot) { dot.style.background = '#555'; dot.style.boxShadow = 'none'; }
                console.log(`WebSocket closed. Reconnecting in ${reconnectDelay / 1000}s...`);
                reconnectTimer = setTimeout(() => {
                    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
                    connect();
                }, reconnectDelay);
            };

            ws.onerror = () => {
                ws.close();
            };

            ws.onmessage = handleMessage;
        }

        const teamScale = {
            7: 1.6, 120: 1.6, 192: 1.6, // Haas
            6: 1.6, 119: 1.6, 191: 1.6, // Racing Bulls
            9: 1.6, 121: 1.6, 194: 1.6, // Sauber
            8: 1.4, 104: 1.4, 193: 1.4  // McLaren
        };

        // ─── LEADERBOARD SCHEDULER ─────────────────────────────────────────
        // Each entry: { mode, duration (ms), weight }
        // weight = how many slots it gets in the rotation playlist.
        // Higher weight = appears more often.
        // Modes: INTERVAL_PLAYER, INTERVAL_LEADER, BEST_LAP, TYRES, ERS
        const LB_SCHEDULE = [
            { mode: 'INTERVAL_PLAYER', duration: 25000, weight: 6 },
            { mode: 'INTERVAL_LEADER', duration: 25000, weight: 6 },
            { mode: 'BEST_LAP', duration: 10000, weight: 2 },
            { mode: 'TYRES', duration: 10000, weight: 1 },
            { mode: 'ERS', duration: 10000, weight: 1 },
        ];

        // Build weighted playlist: repeat each entry by its weight, then shuffle
        function buildPlaylist() {
            const pool = [];
            LB_SCHEDULE.forEach(entry => {
                for (let i = 0; i < entry.weight; i++) pool.push(entry);
            });
            // Fisher-Yates shuffle
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return pool;
        }

        let lbPlaylist = buildPlaylist();
        let lbPlayIdx = 0;
        let lbCurrent = lbPlaylist[0];
        let lbModeTimer = null;
        let lastLapTyresShown = 0;

        function advanceLbMode() {
            const leaderLap = (state.lapData && state.lapData.length > 0)
                ? Math.max(...state.lapData.map(l => l.m_currentLapNum || 0))
                : 0;

            let anyonePitted = false;
            if (state.lapData && state.carStatus) {
                for (let i = 0; i < state.lapData.length; i++) {
                    const l = state.lapData[i];
                    const s = state.carStatus[i];
                    if (l && s && l.m_currentLapNum > 1 && s.m_tyresAgeLaps < l.m_currentLapNum - 1) {
                        anyonePitted = true;
                        break;
                    }
                }
            }

            let found = false;
            let attempts = 0;
            while (!found && attempts < lbPlaylist.length) {
                lbPlayIdx = (lbPlayIdx + 1) % lbPlaylist.length;
                if (lbPlayIdx === 0) lbPlaylist = buildPlaylist(); // reshuffle when playlist loops
                lbCurrent = lbPlaylist[lbPlayIdx];

                // Validate mode
                if (lbCurrent.mode === 'BEST_LAP' && leaderLap < 3) { attempts++; continue; }
                if (lbCurrent.mode === 'TYRES') {
                    if (!anyonePitted || leaderLap <= lastLapTyresShown) { attempts++; continue; }
                }
                found = true;
            }

            if (lbCurrent.mode === 'TYRES') {
                lastLapTyresShown = leaderLap;
            }

            document.getElementById('lb-mode').innerText = lbCurrent.mode.replace('_', ' ');
            renderLeaderboard();
            clearTimeout(lbModeTimer);
            lbModeTimer = setTimeout(() => advanceLbMode(), lbCurrent.duration);
        }

        // Start the scheduler
        document.getElementById('lb-mode').innerText = lbCurrent.mode.replace('_', ' ');
        lbModeTimer = setTimeout(() => advanceLbMode(), lbCurrent.duration);

        function extractShortName(fullName) {
            if (!fullName) return 'UNK';
            const parts = fullName.trim().split(' ');
            const last = parts[parts.length - 1];
            return (last.length >= 3 ? last : fullName).substring(0, 3).toUpperCase();
        }

        function formatMS(ms) {
            if (!ms || ms <= 0) return '--:--.---';
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const r = ms % 1000;
            return `${m}:${String(s).padStart(2, '0')}.${String(r).padStart(3, '0')}`;
        }

        connect();

        function handleMessage(event) {
            const msg = JSON.parse(event.data);

            if (msg.playerIdx !== undefined) {
                state.playerIdx = msg.playerIdx;
            }

            if (msg.type === 'RESET') {
                state.lapData = [];
                state.participants = [];
                state.carTelemetry = [];
                state.carStatus = [];
                state.carDamage = [];
                state.session = {};
                
                sessionBestLap = Infinity;
                sessionBestCarIdx = -1;
                lastLapNums = {};
                carBestLap = {};
                driverLapDisplay = {};
                initialFuel = 0;
                
                document.getElementById('lb-list').innerHTML = '';
                document.getElementById('r-lap').innerText = '--';
                document.getElementById('top-lap').innerText = '--/--';
                document.getElementById('r-pos').innerText = '--';
                document.getElementById('r-gap').innerText = '--';
                document.getElementById('r-gap-who').innerText = 'FRONT';
                
                document.getElementById('b-thr').style.width = '0%';
                document.getElementById('b-brk').style.width = '0%';
                document.getElementById('b-ers').style.width = '0%';
                document.getElementById('b-ers-lap').style.width = '0%';
                document.getElementById('f-fill').style.width = '0%';
                document.getElementById('t-speed').innerText = '0';
                document.getElementById('t-gear').innerText = 'N';
                document.getElementById('r-fuel').innerText = '--';
                
                refreshAll();
                return;
            }

            if (msg.type === 'FULL_STATE') {
                state = msg.data;
                state.playerIdx = msg.playerIdx;
                refreshAll();
                return;
            }

            if (msg.type === 'SESSION') {
                state.session = msg.data;
            }

            if (msg.type === 'PARTICIPANTS') {
                state.participants = msg.data.m_participants;
            }

            if (msg.type === 'LAP_DATA') {
                const now = Date.now();
                const prev = state.lapData;
                const next = msg.data.m_lapData;

                let anyLapCompleted = false;
                if (prev && prev.length) {
                    for (let i = 0; i < next.length; i++) {
                        if (next[i] && prev[i] &&
                            next[i].m_currentLapNum > (prev[i].m_currentLapNum || 0) &&
                            next[i].m_lastLapTimeInMS > 0) {

                            anyLapCompleted = true;
                            const lt = next[i].m_lastLapTimeInMS;
                            let isFastest = false;

                            // Update per-car best lap
                            if (!carBestLap[i] || lt < carBestLap[i]) {
                                carBestLap[i] = lt;
                            }

                            // Update session best
                            if (lt <= sessionBestLap) {
                                sessionBestLap = lt;
                                sessionBestCarIdx = i;
                                isFastest = true;
                            } else if (lt === sessionBestLap && i === sessionBestCarIdx) {
                                isFastest = true;
                            }

                            // Show individual lap time for 7 seconds
                            driverLapDisplay[i] = {
                                text: formatMS(lt),
                                isFastest: isFastest,
                                expireAt: now + 7000
                            };

                            // Clear it automatically after 7s to re-render
                            setTimeout(() => {
                                renderLeaderboard();
                            }, 7000);
                        }
                    }
                }
                state.lapData = next;
                if (anyLapCompleted) {
                    requestAnimationFrame(renderLeaderboard);
                }
            }

            if (msg.type === 'CAR_STATUS') {
                state.carStatus = msg.data.m_carStatusData;
            }

            if (msg.type === 'TELEMETRY') {
                state.carTelemetry = msg.data.m_carTelemetryData;
                updateTelemetry(msg.data.m_carTelemetryData[state.playerIdx]);
            }

            if (msg.type === 'CAR_DAMAGE') {
                state.carDamage = msg.data.m_carDamageData;
            }

            refreshAll();
        };

        function refreshAll() {
            updateRaceControl();
            renderLeaderboard();
            if (state.carTelemetry && state.carTelemetry[state.playerIdx]) {
                updateTelemetry(state.carTelemetry[state.playerIdx]);
            }
        }

        function updateTelemetry(car) {
            if (!car) return;

            document.getElementById('t-speed').innerText = car.m_speed;
            document.getElementById('t-gear').innerText = car.m_gear === 0 ? 'N' : (car.m_gear === -1 ? 'R' : car.m_gear);

            document.getElementById('b-thr').style.width = (car.m_throttle * 100) + '%';
            document.getElementById('b-brk').style.width = (car.m_brake * 100) + '%';

            const ersStatus = state.carStatus[state.playerIdx];
            if (ersStatus) {
                const ers = Math.max(0, Math.min(100, (ersStatus.m_ersStoreEnergy / 4000000) * 100));
                document.getElementById('b-ers').style.width = ers + '%';
                document.getElementById('ers-pct').innerText = Math.round(ers) + '%';

                const ersLap = Math.max(0, 100 - (ersStatus.m_ersDeployedThisLap / 4000000) * 100);
                document.getElementById('b-ers-lap').style.width = ersLap + '%';
                document.getElementById('ers-lap-pct').innerText = Math.round(ersLap) + '%';

                document.getElementById('ers-mode').innerText = ersModes[ersStatus.m_ersDeployMode] || 'NONE';
            }

            const t = car.m_tyresSurfaceTemperature;
            // RL RR FL FR
            document.getElementById('v-rl').innerText = t[0] + '°';
            document.getElementById('v-rr').innerText = t[1] + '°';
            document.getElementById('v-fl').innerText = t[2] + '°';
            document.getElementById('v-fr').innerText = t[3] + '°';

            // Colour tyre boxes by heat
            ['fl', 'fr', 'rl', 'rr'].forEach((w, idx) => {
                const temp = t[idx < 2 ? idx + 2 : idx - 2]; // FL=t[2],FR=t[3],RL=t[0],RR=t[1]
                const box = document.getElementById('box-' + w);
                if (!box) return;
                box.classList.remove('hot');
                if (temp > 110) box.classList.add('hot');
            });
            
            const wear = state.carDamage && state.carDamage[state.playerIdx] ? state.carDamage[state.playerIdx].m_tyresWear : [0,0,0,0];
            document.getElementById('w-rl').innerText = Math.round(wear[0]) + '%';
            document.getElementById('w-rr').innerText = Math.round(wear[1]) + '%';
            document.getElementById('w-fl').innerText = Math.round(wear[2]) + '%';
            document.getElementById('w-fr').innerText = Math.round(wear[3]) + '%';
        }

        function updateRaceControl() {
            const pIdx = state.playerIdx;
            const lap = state.lapData[pIdx];
            const status = state.carStatus[pIdx];
            const session = state.session;

            if (!lap || !status) return;

            // Track best laps
            if (lap.m_lastLapTimeInMS > 0 && lap.m_currentLapNum > (lastLapNums[pIdx] || 0)) {
                lastLapNums[pIdx] = lap.m_currentLapNum;
                state.lapData.forEach((l, i) => {
                    if (l.m_lastLapTimeInMS > 0 && l.m_lastLapTimeInMS < sessionBestLap) {
                        sessionBestLap = l.m_lastLapTimeInMS;
                        sessionBestCarIdx = i;
                    }
                });
            }

            document.getElementById('r-lap').innerText = lap.m_currentLapNum;
            document.getElementById('top-lap').innerText = `${lap.m_currentLapNum}/${session.m_totalLaps || '--'}`;

            document.getElementById('r-pos').innerText = 'P' + lap.m_carPosition;
            document.getElementById('r-temp').innerText = (session.m_trackTemperature ?? '--') + '°C';

            const trackInfo = trackNames[session.m_trackId];
            document.getElementById('r-track').innerText = trackInfo ? trackInfo.name : 'UNKNOWN';
            document.getElementById('r-country').innerText = trackInfo ? trackInfo.country : 'TRACK';
            const flagEl = document.getElementById('r-flag');
            if (flagEl) flagEl.className = trackInfo ? `fi fi-${trackInfo.code}` : 'fi';

            if (status.m_fuelInTank > initialFuel) {
                initialFuel = status.m_fuelInTank;
            }
            if (initialFuel === 0) initialFuel = 100;

            document.getElementById('r-fuel').innerText = status.m_fuelInTank.toFixed(1) + ' KG';
            document.getElementById('f-fill').style.width =
                ((status.m_fuelInTank / initialFuel) * 100) + '%';

            const drsEl = document.getElementById('r-drs');
            const telemetry = state.carTelemetry ? state.carTelemetry[pIdx] : null;

            drsEl.style.fontSize = '22px'; // Default size

            if (telemetry && telemetry.m_drs === 1) {
                drsEl.innerText = 'ON';
                drsEl.style.color = '#00ff00';
                drsEl.style.fontSize = '22px';
            } else if (status.m_drsAllowed) {
                drsEl.innerText = 'AVAILABLE';
                drsEl.style.color = 'var(--purple-fastest)';
                drsEl.style.fontSize = '13px';
            } else if (status.m_drsActivationDistance > 0) {
                drsEl.innerText = 'DRS ZONE';
                drsEl.style.color = '#ffd700';
                drsEl.style.fontSize = '13px';
            } else {
                drsEl.innerText = 'OFF';
                drsEl.style.color = '#555';
            }

            const tyre = tyreMap[status.m_visualTyreCompound];
            if (tyre) {
                const ico = document.getElementById('r-tyre-ico');
                if (tyre.img) ico.src = tyre.img;
            }

            document.getElementById('r-tyre-age').innerText =
                status.m_tyresAgeLaps + ' LAPS';

            if (lap.m_carPosition === 1) {
                document.getElementById('r-gap').innerText = 'LEAD';
                document.getElementById('r-gap-who').innerText = '';
            } else if (lap.m_deltaToCarInFrontInMS !== undefined) {
                document.getElementById('r-gap').innerText = '+' + (lap.m_deltaToCarInFrontInMS / 1000).toFixed(3);
                const aheadRow = state.lapData.find(x => x.m_carPosition === lap.m_carPosition - 1);
                const aheadIdx = aheadRow ? state.lapData.indexOf(aheadRow) : -1;
                const aheadP = aheadIdx >= 0 ? state.participants[aheadIdx] : null;
                document.getElementById('r-gap-who').innerText = extractShortName(aheadP?.m_name);
            }
        }

        function renderLeaderboard() {
            const list = document.getElementById('lb-list');

            if (!state.lapData.length) return;

            const allValid = state.lapData
                .map((l, i) => ({ i, lap: l }))
                .filter(x => x.lap.m_carPosition > 0)
                .sort((a, b) => a.lap.m_carPosition - b.lap.m_carPosition);

            if (!allValid.length) return;

            const pIdx = state.playerIdx;
            const playerPos = state.lapData[pIdx]?.m_carPosition || 0;
            const leaderLap = allValid[0]?.lap.m_currentLapNum || 0;

            let displayRows;
            if (allValid.length <= 10) {
                displayRows = allValid;
            } else if (playerPos > 0 && playerPos <= 8) {
                displayRows = allValid.slice(0, 10);
            } else if (playerPos >= 9) {
                const top3 = allValid.slice(0, 3);
                let endPos = Math.min(playerPos + 3, allValid.length);
                let startPos = endPos - 6;
                if (startPos <= 3) {
                    startPos = 4;
                    endPos = 10;
                }
                const around = allValid.filter(x =>
                    x.lap.m_carPosition >= startPos &&
                    x.lap.m_carPosition <= endPos
                );
                displayRows = [...top3, ...around];
            } else {
                displayRows = allValid.slice(0, 10);
            }

            list.innerHTML = displayRows.map(row => {
                if (row.divider) return `<div class="lb-row divider">•••</div>`;

                const p = state.participants[row.i];
                const s = state.carStatus[row.i];
                const lap = row.lap;
                const isPlayer = row.i === pIdx;

                // ── Value per mode ───────────────────────────────────────
                const mode = lbCurrent.mode;
                let gapText = '-';
                let gapClass = 'lb-val';

                const leader = state.lapData.find(l => l.m_carPosition === 1) || lap;
                const trackLen = state.session.m_trackLength || 1;

                // Real track position gap to leader:
                const distToLeader = leader.m_totalDistance - lap.m_totalDistance;
                // If difference is greater than track length, they are lapped
                const lappedLaps = Math.floor(distToLeader / trackLen);
                const lapped = lappedLaps > 0;

                const now = Date.now();
                if (driverLapDisplay[row.i] && driverLapDisplay[row.i].expireAt > now) {
                    gapText = driverLapDisplay[row.i].text;
                    gapClass = driverLapDisplay[row.i].isFastest ? 'lb-val fastest' : 'lb-val';
                } else if (mode === 'INTERVAL_PLAYER') {
                    // Gap referenced to the player's car
                    if (isPlayer) {
                        gapText = '◆';
                    } else {
                        const playerLap = state.lapData[pIdx];
                        if (playerLap) {
                            const distToPlayer = playerLap.m_totalDistance - lap.m_totalDistance;
                            const lappedToPlayer = Math.floor(distToPlayer / trackLen);
                            const lappedByPlayer = Math.floor(-distToPlayer / trackLen);

                            if (lappedToPlayer > 0) {
                                gapText = `+${lappedToPlayer} LAP${lappedToPlayer > 1 ? 'S' : ''}`;
                                gapClass = 'lb-val lapped';
                            } else if (lappedByPlayer > 0) {
                                gapText = `-${lappedByPlayer} LAP${lappedByPlayer > 1 ? 'S' : ''}`;
                                gapClass = 'lb-val lapped';
                            } else {
                                const gapMs = lap.m_deltaToRaceLeaderInMS - playerLap.m_deltaToRaceLeaderInMS;
                                if (gapMs > 0) {
                                    gapText = '+' + (gapMs / 1000).toFixed(3);
                                } else if (gapMs < 0) {
                                    gapText = '-' + (Math.abs(gapMs) / 1000).toFixed(3);
                                } else {
                                    gapText = '-';
                                }
                            }
                        }
                    }

                } else if (mode === 'INTERVAL_LEADER') {
                    // Gap to race leader
                    if (lap.m_carPosition === 1) {
                        gapText = '-';
                    } else if (lapped) {
                        gapText = `+${lappedLaps} LAP${lappedLaps > 1 ? 'S' : ''}`;
                        gapClass = 'lb-val lapped';
                    } else {
                        gapText = '+' + (lap.m_deltaToRaceLeaderInMS > 0
                            ? (lap.m_deltaToRaceLeaderInMS / 1000).toFixed(3)
                            : (lap.m_deltaToCarInFrontInMS / 1000).toFixed(3));
                    }

                } else if (mode === 'BEST_LAP') {
                    const best = carBestLap[row.i];
                    gapText = formatMS(best);
                    gapClass = row.i === sessionBestCarIdx ? 'lb-val fastest' : 'lb-val';

                } else if (mode === 'TYRES') {
                    if (s) {
                        const tyre = tyreMap[s.m_visualTyreCompound];
                        gapText = tyre ? `${s.m_tyresAgeLaps} LAPS` : '--';
                    }

                } else if (mode === 'ERS') {
                    if (s) {
                        const pct = Math.round((s.m_ersStoreEnergy / 4000000) * 100);
                        const modeName = ersModes[s.m_ersDeployMode] || 'NONE';
                        gapText = `${modeName} ${pct}%`;
                    }
                }

                // Tyre icon
                let tyreHtml = '';
                if (s) {
                    const tyre = tyreMap[s.m_visualTyreCompound];
                    if (tyre && tyre.img) {
                        tyreHtml = `<img src="${tyre.img}" style="width:26px;height:26px;object-fit:contain;flex-shrink:0;">`;
                    } else if (tyre) {
                        tyreHtml = `<span class="lb-tyre ${tyre.cls}">${tyre.short}</span>`;
                    }
                }

                // Team logo
                let tId = p ? p.m_teamId : undefined;
                let logoSrc = (tId !== undefined) ? (teamLogos[tId] || '') : '';
                let tScale = (tId !== undefined && teamScale[tId]) ? teamScale[tId] : 1.2;

                const teamHtml = logoSrc
                    ? `<img src="${encodeURI(logoSrc)}" class="lb-team-logo" style="transform: scale(${tScale});">`
                    : `<div class="lb-team-bar" style="background:${(tId !== undefined && teamColors[tId]) ? teamColors[tId] : '#fff'}; width: ${tId !== undefined && !teamColors[tId] ? '20px' : '3px'}; display:flex; justify-content:center; align-items:center; font-size:8px; color:#000;">${tId !== undefined && !teamColors[tId] ? tId : ''}</div>`;

                const shortName = extractShortName(p?.m_name);

                return `
                <div class="lb-row ${isPlayer ? 'player' : ''}">
                    <div class="lb-pos">${lap.m_carPosition}</div>
                    ${teamHtml}
                    <div class="lb-name">${shortName}</div>
                    ${tyreHtml}
                    <div class="${gapClass}">${gapText}</div>
                </div>`;
            }).join('');
        }
    </script>
</body>

</html>
