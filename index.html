<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1 Telemetry Layout Manager</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: transparent; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; background: transparent; }
        #loading { position: absolute; font-size: 24px; font-weight: bold; color: #777; display: none; }
    </style>
</head>
<body>
    <div id="loading">WAITING FOR TELEMETRY...</div>
    <iframe id="telemetry-frame" src="f126-layout.html"></iframe>

    <script>
        const frame = document.getElementById('telemetry-frame');
        const loading = document.getElementById('loading');
        let currentLayout = 'f126-layout.html'; // Default
        let ws = null;
        let reconnectTimeout = null;

        function connect() {
            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                loading.style.display = 'none';
                clearTimeout(reconnectTimeout);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                let format = null;

                if (msg.type === 'FULL_STATE' && msg.data.format) {
                    format = msg.data.format;
                } else if (msg.type === 'DEBUG_INFO' && msg.data.format) {
                    format = msg.data.format;
                }

                if (format) {
                    const targetLayout = format === 2025 ? 'f125-layout.html' : 'f126-layout.html';
                    if (currentLayout !== targetLayout) {
                        currentLayout = targetLayout;
                        frame.src = targetLayout;
                    }
                }
            };

            ws.onerror = (err) => {
                // error handled by onclose
            };
            
            ws.onclose = () => {
                loading.style.display = 'block';
                loading.innerText = 'DISCONNECTED. RECONNECTING...';
                clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connect, 2000);
            };
        }

        connect();
    </script>
</body>
</html>
