<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/6.6.6/css/flag-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap');

        :root {
            --f1-red: #e10600;
            --bg-dark: rgba(10, 10, 10, 0.98);
            --border-grey: #2a2a2a;
            --widget-bg: rgba(255, 255, 255, 0.02);
            --text-main: #ffffff;
            --text-dim: #999;
            --purple-fastest: #b138ff;
            --t-mercedes: #27F4D2;
            --t-ferrari: #E8002D;
            --t-redbull: #3671C6;
            --t-williams: #64CFF0;
            --t-aston: #229971;
            --t-alpine: #0093CC;
            --t-rb: #6692FF;
            --t-haas: #B6BABD;
            --t-mclaren: #FF8000;
            --t-sauber: #00E701;
        }

        body {
            margin: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Titillium Web', sans-serif;
            color: var(--text-main);
            text-transform: uppercase;
            overflow: hidden;
        }

        .f1-top-tab {
            position: absolute;
            bottom: 270px;
            left: 0;
            height: 55px;
            width: 380px;
            background: #111;
            clip-path: polygon(0 0, 85% 0, 100% 100%, 0 100%);
            display: flex;
            align-items: center;
            padding: 0 30px;
            border-top: 4px solid var(--f1-red);
            z-index: 20;
        }

        .f1-top-tab .logo {
            font-weight: 900;
            font-size: 38px;
            color: var(--f1-red);
            font-style: italic;
            margin-right: 25px;
        }

        .f1-top-tab .session {
            font-weight: 700;
            font-size: 18px;
            margin-right: 15px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 10px;
            background: #555;
        }

        .status-online {
            background: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .hud-main-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 270px;
            background: var(--bg-dark);
            border: none;
            border-top: 1px solid var(--border-grey);
            border-radius: 0;
            display: grid;
            grid-template-columns: 380px 1fr 340px 420px;
            overflow: hidden;
            z-index: 10;
        }

        .section {
            border-right: 1px solid var(--border-grey);
            position: relative;
            padding: 45px 15px 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-label {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .section-label span {
            color: var(--f1-red);
        }

        .widget-box {
            background: var(--widget-bg);
            border: 1px solid #222;
            border-radius: 4px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* LEADERBOARD */
        .lb-row {
            display: flex;
            align-items: center;
            height: 22px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 1px;
            width: 100%;
            gap: 5px;
        }

        .lb-row.player {
            background: linear-gradient(90deg, rgba(225, 6, 0, 0.45) 0%, transparent 100%);
            border-left: 3px solid var(--f1-red);
            padding-left: 3px;
        }

        .lb-row.divider {
            height: 8px;
            justify-content: center;
            opacity: 0.4;
            font-size: 9px;
            letter-spacing: 3px;
        }

        .lb-pos {
            width: 20px;
            text-align: right;
            font-size: 11px;
            color: var(--text-dim);
        }

        .lb-team-bar {
            width: 3px;
            height: 14px;
            border-radius: 2px;
            background: #fff;
            flex-shrink: 0;
        }

        .lb-name {
            flex: 1;
            padding-left: 4px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .lb-tyre {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 900;
            flex-shrink: 0;
        }

        .lb-val {
            width: 68px;
            text-align: right;
            font-family: 'Titillium Web', monospace;
            font-size: 11px;
            color: #ccc;
        }

        .lb-val.fastest {
            color: var(--purple-fastest);
        }

        .lb-val.lapped {
            color: #888;
        }

        /* RACE CONTROL GRID */
        .rc-grid {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            flex: 1;
        }

        .rc-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .w-label {
            font-size: 9px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .w-val {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }

        .w-sub {
            font-size: 10px;
            color: #666;
            font-weight: 700;
            margin-top: 2px;
        }

        .fuel-bar {
            width: 50px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }

        .fuel-fill {
            height: 100%;
            background: #ffd700;
            transition: width 0.3s;
        }

        /* TELEMETRY & TYRES */
        .tel-stats {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 5px;
        }

        .tel-unit .v {
            font-size: 40px;
            font-weight: 900;
            line-height: 1;
            text-align: center;
        }

        .tel-unit .l {
            font-size: 10px;
            color: var(--text-dim);
            text-align: center;
        }

        .t-bar-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .t-bar-bg {
            flex: 1;
            height: 5px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }

        .t-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.05s linear;
        }

        .tyre-mini-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            width: 100%;
            margin-top: 5px;
        }

        .tyre-mini-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            padding: 2px 5px;
            border-radius: 2px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 800;
        }

        .tyre-mini-box.hot {
            color: var(--f1-red);
            border-color: var(--f1-red);
        }

        /* CAMERA 16:9 */
        .camera {
            border-right: none;
            padding: 45px 15px 15px 15px;
        }

        .cam-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: 1px solid #222;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .cam-label {
            position: absolute;
            bottom: 8px;
            left: 10px;
            font-size: 11px;
            font-weight: 900;
            color: #444;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .rec-dot {
            width: 6px;
            height: 6px;
            background: var(--f1-red);
            border-radius: 50%;
        }

        .t-ico {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 900;
        }

        .t-S {
            border-color: #ff2a2a;
            color: #ff2a2a;
        }

        .t-M {
            border-color: #ffd700;
            color: #ffd700;
        }

        .t-H {
            border-color: #ffffff;
            color: #ffffff;
        }

        .t-I {
            border-color: #00cc44;
            color: #00cc44;
        }

        .t-W {
            border-color: #4488ff;
            color: #4488ff;
        }

        /* ERS stacked — compact */
        .ers-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 100%;
        }

        .ers-header-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            font-weight: 800;
            line-height: 1;
        }

        .ers-mode-badge {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            padding: 1px 4px;
            font-size: 8px;
            color: #ffd700;
            margin-left: auto;
        }

        .ers-bar-row {
            display: flex;
            align-items: center;
            gap: 5px;
            line-height: 1;
        }

        .ers-bar-label {
            width: 22px;
            font-size: 8px;
            font-weight: 800;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .ers-bar-bg {
            flex: 1;
            height: 4px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }

        .ers-pct {
            width: 24px;
            text-align: right;
            font-size: 8px;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        #lb-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            margin-top: 5px;
        }

        .lb-row {
            background: rgba(255, 255, 255, 0.02);
            border-left: 2px solid transparent;
            padding: 0 4px;
            border-radius: 2px;
        }
    </style>
</head>

<body>

    <div class="f1-top-tab">
        <div id="status-dot" class="status-dot"></div>
        <img src="resources/f1-logo.svg" style="height:22px; margin-right:20px;">
        <div class="session" id="top-session">LIVE</div>
        <div style="font-size: 14px; font-weight: 800; color: var(--text-dim);">LAP <span id="top-lap"
                style="color:#fff">--/--</span></div>
    </div>

    <div class="hud-main-bar">
        <div class="section">
            <div class="section-label"><span>//</span> <span id="lb-mode">INTERVAL</span> <span>//</span></div>
            <div id="lb-list"></div>
        </div>

        <div class="section">
            <div class="section-label"><span>//</span> RACE CONTROL <span>//</span></div>
            <div class="rc-grid">
                <div class="rc-row">
                    <div class="widget-box">
                        <div class="w-label">VOLTA</div>
                        <div class="w-val" id="r-lap">--</div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">POSIÇÃO</div>
                        <div class="w-val" id="r-pos" style="color:var(--f1-red)">--</div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">GAP</div>
                        <div class="w-val" id="r-gap">--</div>
                        <div class="w-sub" id="r-gap-who">FRONT</div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">CIRCUITO</div>
                        <div class="w-val" style="font-size:14px; line-height:1.1" id="r-track">N/A</div>
                        <div class="w-sub"><span id="r-country">TRACK</span> <span id="r-flag" class="fi"
                                style="margin-left:3px"></span></div>
                    </div>
                </div>
                <div class="rc-row">
                    <div class="widget-box">
                        <div class="w-label">PNEU</div>
                        <img id="r-tyre-ico" src="resources/tyre-m.png"
                            style="width:30px;height:30px;object-fit:contain;">
                        <div class="w-sub" id="r-tyre-age">-- LAPS</div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">COMBUSTÍVEL</div>
                        <div class="w-val" id="r-fuel">--</div>
                        <div class="fuel-bar">
                            <div id="f-fill" class="fuel-fill"></div>
                        </div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">DRS</div>
                        <div class="w-val" id="r-drs" style="color:#555">OFF</div>
                    </div>
                    <div class="widget-box">
                        <div class="w-label">PISTA</div>
                        <div class="w-val" id="r-temp">--°C</div>
                        <div class="w-sub">☀ TEMPERATURA</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-label"><span>//</span> TELEMETRIA <span>//</span></div>
            <div class="tel-stats">
                <div class="tel-unit">
                    <div class="v" id="t-gear">N</div>
                    <div class="l">GEAR</div>
                </div>
                <div class="tel-unit">
                    <div class="v" id="t-speed">0</div>
                    <div class="l">KM/H</div>
                </div>
            </div>
            <div class="ers-stack">
                <div class="ers-header-row">
                    ERS
                    <span class="ers-mode-badge" id="ers-mode">NONE</span>
                </div>
                <div class="ers-bar-row">
                    <span class="ers-bar-label">BATT</span>
                    <div class="t-bar-bg">
                        <div id="b-ers" class="t-bar-fill" style="background:#ffd700"></div>
                    </div>
                    <span class="ers-pct" id="ers-pct">0%</span>
                </div>
                <div class="ers-bar-row">
                    <span class="ers-bar-label">LAP</span>
                    <div class="t-bar-bg">
                        <div id="b-ers-lap" class="t-bar-fill" style="background:#ffaa00"></div>
                    </div>
                    <span class="ers-pct" id="ers-lap-pct">0%</span>
                </div>
            </div>
            <div class="t-bar-row"><span>THR</span>
                <div class="t-bar-bg">
                    <div id="b-thr" class="t-bar-fill" style="background:#00ff00"></div>
                </div>
            </div>
            <div class="t-bar-row"><span>BRK</span>
                <div class="t-bar-bg">
                    <div id="b-brk" class="t-bar-fill" style="background:var(--f1-red)"></div>
                </div>
            </div>

            <div class="tyre-mini-grid">
                <div class="tyre-mini-box" id="box-fl"><span>FL</span><span id="v-fl">--</span></div>
                <div class="tyre-mini-box" id="box-fr"><span>FR</span><span id="v-fr">--</span></div>
                <div class="tyre-mini-box" id="box-rl"><span>RL</span><span id="v-rl">--</span></div>
                <div class="tyre-mini-box" id="box-rr"><span>RR</span><span id="v-rr">--</span></div>
            </div>
        </div>

        <div class="section camera">
            <div class="section-label"><span>//</span> ONBOARD <span>//</span></div>
            <div class="cam-container">
                <img src="https://logodownload.org/wp-content/uploads/2018/11/formula-1-logo-7.png"
                    style="width:80px; opacity:0.05">
                <div class="cam-label">LIVE FEED <div class="rec-dot"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let reconnectDelay = 3000;
        let reconnectTimer = null;

        function connect() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                clearTimeout(reconnectTimer);
                reconnectDelay = 3000;
                const dot = document.getElementById('status-dot');
                if (dot) { dot.style.background = '#00ff00'; dot.style.boxShadow = '0 0 8px #00ff00'; }
                console.log('WebSocket connected');
            };

            ws.onclose = () => {
                const dot = document.getElementById('status-dot');
                if (dot) { dot.style.background = '#555'; dot.style.boxShadow = 'none'; }
                console.log(`WebSocket closed. Reconnecting in ${reconnectDelay / 1000}s...`);
                reconnectTimer = setTimeout(() => {
                    reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
                    connect();
                }, reconnectDelay);
            };

            ws.onerror = () => {
                ws.close();
            };

            ws.onmessage = handleMessage;
        }

        let state = {
            participants: [],
            lapData: [],
            carStatus: [],
            session: {},
            playerIdx: 0
        };

        let sessionBestLap = Infinity;
        let sessionBestCarIdx = -1;
        let lastLapNums = {};

        const trackNames = {
            0: { name: 'MELBOURNE', country: 'AUSTRALIA', code: 'au' },
            2: { name: 'SHANGHAI', country: 'CHINA', code: 'cn' },
            3: { name: 'SAKHIR', country: 'BAHRAIN', code: 'bh' },
            4: { name: 'CATALUNYA', country: 'SPAIN', code: 'es' },
            5: { name: 'MONACO', country: 'MONACO', code: 'mc' },
            6: { name: 'MONTREAL', country: 'CANADA', code: 'ca' },
            7: { name: 'SILVERSTONE', country: 'UK', code: 'gb' },
            9: { name: 'HUNGARORING', country: 'HUNGARY', code: 'hu' },
            10: { name: 'SPA', country: 'BELGIUM', code: 'be' },
            11: { name: 'MONZA', country: 'ITALY', code: 'it' },
            12: { name: 'SINGAPORE', country: 'SINGAPORE', code: 'sg' },
            13: { name: 'SUZUKA', country: 'JAPAN', code: 'jp' },
            14: { name: 'ABU DHABI', country: 'UAE', code: 'ae' },
            15: { name: 'TEXAS', country: 'USA', code: 'us' },
            16: { name: 'BRAZIL', country: 'BRAZIL', code: 'br' },
            17: { name: 'AUSTRIA', country: 'AUSTRIA', code: 'at' },
            19: { name: 'MEXICO', country: 'MEXICO', code: 'mx' },
            20: { name: 'BAKU', country: 'AZERBAIJAN', code: 'az' },
            26: { name: 'ZANDVOORT', country: 'NETHERLANDS', code: 'nl' },
            27: { name: 'IMOLA', country: 'ITALY', code: 'it' },
            29: { name: 'JEDDAH', country: 'SAUDI ARABIA', code: 'sa' },
            30: { name: 'MIAMI', country: 'USA', code: 'us' },
            31: { name: 'LAS VEGAS', country: 'USA', code: 'us' },
            32: { name: 'LOSAIL', country: 'QATAR', code: 'qa' },
            39: { name: 'SILVERSTONE R', country: 'UK', code: 'gb' },
            40: { name: 'AUSTRIA R', country: 'AUSTRIA', code: 'at' },
            41: { name: 'ZANDVOORT R', country: 'NETHERLANDS', code: 'nl' }
        };

        const teamColors = {
            0: 'var(--t-mercedes)', 1: 'var(--t-ferrari)', 2: 'var(--t-redbull)',
            3: 'var(--t-williams)', 4: 'var(--t-aston)', 5: 'var(--t-alpine)',
            6: 'var(--t-rb)', 7: 'var(--t-haas)', 8: 'var(--t-mclaren)',
            9: 'var(--t-sauber)'
        };

        const ersModes = ['NONE', 'MEDIUM', 'HOTLAP', 'OVERTAKE'];

        const tyreMap = {
            16: { short: 'S', cls: 't-S', img: 'resources/tyre-s.png' },
            17: { short: 'M', cls: 't-M', img: 'resources/tyre-m.png' },
            18: { short: 'H', cls: 't-H', img: 'resources/tyre-h.png' },
            7: { short: 'I', cls: 't-I', img: 'resources/tyre-i.png' },
            8: { short: 'W', cls: 't-W', img: 'resources/tyre-w.png' }
        };

        const teamLogos = {
            0: 'resources/mercedes.png',
            1: 'resources/ferrari.png',
            2: 'resources/redbull.png',
            3: 'resources/williams.png',
            4: 'resources/aston martin.png',
            5: 'resources/alpine.png',
            6: 'resources/racing bulls.png',
            7: 'resources/haas.png',
            8: 'resources/mclaren.png',
            9: 'resources/sauber.png'
        };

        const lbModes = ['INTERVAL', 'TYRES', 'ERS'];
        let lbMode = 0;

        function extractShortName(fullName) {
            if (!fullName) return 'UNK';
            const parts = fullName.trim().split(' ');
            const last = parts[parts.length - 1];
            return (last.length >= 3 ? last : fullName).substring(0, 3).toUpperCase();
        }

        function formatMS(ms) {
            if (!ms || ms <= 0) return '--:--.---';
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const r = ms % 1000;
            return `${m}:${String(s).padStart(2, '0')}.${String(r).padStart(3, '0')}`;
        }

        setInterval(() => {
            lbMode = (lbMode + 1) % lbModes.length;
            document.getElementById('lb-mode').innerText = lbModes[lbMode];
            renderLeaderboard();
        }, 6000);

        connect();

        function handleMessage(event) {
            const msg = JSON.parse(event.data);

            if (msg.playerIdx !== undefined) {
                state.playerIdx = msg.playerIdx;
            }

            if (msg.type === 'FULL_STATE') {
                state = msg.data;
                state.playerIdx = msg.playerIdx;
                refreshAll();
                return;
            }

            if (msg.type === 'SESSION') {
                state.session = msg.data;
            }

            if (msg.type === 'PARTICIPANTS') {
                state.participants = msg.data.m_participants;
            }

            if (msg.type === 'LAP_DATA') {
                state.lapData = msg.data.m_lapData;
            }

            if (msg.type === 'CAR_STATUS') {
                state.carStatus = msg.data.m_carStatusData;
            }

            if (msg.type === 'TELEMETRY') {
                updateTelemetry(msg.data.m_carTelemetryData[state.playerIdx]);
            }

            refreshAll();
        };

        function refreshAll() {
            updateRaceControl();
            renderLeaderboard();
        }

        function updateTelemetry(car) {
            if (!car) return;

            document.getElementById('t-speed').innerText = car.m_speed;
            document.getElementById('t-gear').innerText = car.m_gear === 0 ? 'N' : (car.m_gear === -1 ? 'R' : car.m_gear);

            document.getElementById('b-thr').style.width = (car.m_throttle * 100) + '%';
            document.getElementById('b-brk').style.width = (car.m_brake * 100) + '%';

            const ersStatus = state.carStatus[state.playerIdx];
            if (ersStatus) {
                const ers = Math.max(0, Math.min(100, (ersStatus.m_ersStoreEnergy / 4000000) * 100));
                document.getElementById('b-ers').style.width = ers + '%';
                document.getElementById('ers-pct').innerText = Math.round(ers) + '%';

                const ersLap = Math.max(0, 100 - (ersStatus.m_ersDeployedThisLap / 4000000) * 100);
                document.getElementById('b-ers-lap').style.width = ersLap + '%';
                document.getElementById('ers-lap-pct').innerText = Math.round(ersLap) + '%';

                document.getElementById('ers-mode').innerText = ersModes[ersStatus.m_ersDeployMode] || 'NONE';
            }

            const t = car.m_tyresSurfaceTemperature;
            // RL RR FL FR
            document.getElementById('v-rl').innerText = t[0] + '°';
            document.getElementById('v-rr').innerText = t[1] + '°';
            document.getElementById('v-fl').innerText = t[2] + '°';
            document.getElementById('v-fr').innerText = t[3] + '°';

            // Colour tyre boxes by heat
            ['fl', 'fr', 'rl', 'rr'].forEach((w, idx) => {
                const temp = t[idx < 2 ? idx + 2 : idx - 2]; // FL=t[2],FR=t[3],RL=t[0],RR=t[1]
                const box = document.getElementById('box-' + w);
                if (!box) return;
                box.classList.remove('hot');
                if (temp > 110) box.classList.add('hot');
            });
        }

        function updateRaceControl() {
            const pIdx = state.playerIdx;
            const lap = state.lapData[pIdx];
            const status = state.carStatus[pIdx];
            const session = state.session;

            if (!lap || !status) return;

            // Track best laps
            if (lap.m_lastLapTimeInMS > 0 && lap.m_currentLapNum > (lastLapNums[pIdx] || 0)) {
                lastLapNums[pIdx] = lap.m_currentLapNum;
                state.lapData.forEach((l, i) => {
                    if (l.m_lastLapTimeInMS > 0 && l.m_lastLapTimeInMS < sessionBestLap) {
                        sessionBestLap = l.m_lastLapTimeInMS;
                        sessionBestCarIdx = i;
                    }
                });
            }

            document.getElementById('r-lap').innerText = lap.m_currentLapNum;
            document.getElementById('top-lap').innerText = `${lap.m_currentLapNum}/${session.m_totalLaps || '--'}`;

            document.getElementById('r-pos').innerText = 'P' + lap.m_carPosition;
            document.getElementById('r-temp').innerText = (session.m_trackTemperature ?? '--') + '°C';

            const trackInfo = trackNames[session.m_trackId];
            document.getElementById('r-track').innerText = trackInfo ? trackInfo.name : 'UNKNOWN';
            document.getElementById('r-country').innerText = trackInfo ? trackInfo.country : 'TRACK';
            const flagEl = document.getElementById('r-flag');
            if (flagEl) flagEl.className = trackInfo ? `fi fi-${trackInfo.code}` : 'fi';

            document.getElementById('r-fuel').innerText = status.m_fuelInTank.toFixed(1) + ' KG';
            document.getElementById('f-fill').style.width =
                ((status.m_fuelInTank / status.m_fuelCapacity) * 100) + '%';

            const drsEl = document.getElementById('r-drs');
            if (status.m_drsAllowed) {
                drsEl.innerText = 'ON';
                drsEl.style.color = '#00ff00';
            } else {
                drsEl.innerText = 'OFF';
                drsEl.style.color = '#555';
            }

            const tyre = tyreMap[status.m_visualTyreCompound];
            if (tyre) {
                const ico = document.getElementById('r-tyre-ico');
                if (tyre.img) ico.src = tyre.img;
            }

            document.getElementById('r-tyre-age').innerText =
                status.m_tyresAgeLaps + ' LAPS';

            if (lap.m_carPosition === 1) {
                document.getElementById('r-gap').innerText = 'LEAD';
                document.getElementById('r-gap-who').innerText = '';
            } else if (lap.m_deltaToCarInFrontInMS !== undefined) {
                document.getElementById('r-gap').innerText = '+' + (lap.m_deltaToCarInFrontInMS / 1000).toFixed(3);
                const aheadRow = state.lapData.find(x => x.m_carPosition === lap.m_carPosition - 1);
                const aheadIdx = aheadRow ? state.lapData.indexOf(aheadRow) : -1;
                const aheadP = aheadIdx >= 0 ? state.participants[aheadIdx] : null;
                document.getElementById('r-gap-who').innerText = extractShortName(aheadP?.m_name);
            }
        }

        function renderLeaderboard() {
            const list = document.getElementById('lb-list');

            if (!state.lapData.length) return;

            const allValid = state.lapData
                .map((l, i) => ({ i, lap: l }))
                .filter(x => x.lap.m_carPosition > 0)
                .sort((a, b) => a.lap.m_carPosition - b.lap.m_carPosition);

            if (!allValid.length) return;

            const pIdx = state.playerIdx;
            const playerPos = state.lapData[pIdx]?.m_carPosition || 0;
            const leaderLap = allValid[0]?.lap.m_currentLapNum || 0;

            let displayRows;
            if (playerPos > 0 && playerPos <= 9) {
                displayRows = allValid.slice(0, Math.max(playerPos + 2, 9));
            } else if (playerPos > 9) {
                const top3 = allValid.slice(0, 3);
                const around = allValid.filter(x =>
                    x.lap.m_carPosition >= playerPos - 2 &&
                    x.lap.m_carPosition <= playerPos + 2
                );
                displayRows = [...top3, { divider: true }, ...around];
            } else {
                displayRows = allValid.slice(0, 10);
            }

            list.innerHTML = displayRows.map(row => {
                if (row.divider) return `<div class="lb-row divider">•••</div>`;

                const p = state.participants[row.i];
                const s = state.carStatus[row.i];
                const lap = row.lap;
                const isPlayer = row.i === pIdx;

                // Gap calculation
                let gapText = '-';
                let gapClass = 'lb-val';

                if (lap.m_carPosition === 1) {
                    gapText = '-';
                } else {
                    const lapDiff = leaderLap - lap.m_currentLapNum;
                    if (lapDiff > 0) {
                        gapText = `+${lapDiff} LAP${lapDiff > 1 ? 'S' : ''}`;
                        gapClass = 'lb-val lapped';
                    } else if (lap.m_deltaToCarInFrontInMS > 0) {
                        gapText = '+' + (lap.m_deltaToCarInFrontInMS / 1000).toFixed(3);
                    }
                }

                // Override with purple best lap time for fastest driver
                if (row.i === sessionBestCarIdx && sessionBestLap < Infinity) {
                    gapText = formatMS(sessionBestLap);
                    gapClass = 'lb-val fastest';
                }

                // Tyre icon
                let tyreHtml = '';
                if (s) {
                    const tyre = tyreMap[s.m_visualTyreCompound];
                    if (tyre) tyreHtml = `<span class="lb-tyre ${tyre.cls}">${tyre.short}</span>`;
                }

                // Team logo
                const logoSrc = (p && p.m_teamId !== undefined) ? (teamLogos[p.m_teamId] || '') : '';
                const teamHtml = logoSrc
                    ? `<img src="${logoSrc}" style="width:14px;height:14px;object-fit:contain;flex-shrink:0;opacity:0.9;">`
                    : `<div class="lb-team-bar" style="background:${(p && teamColors[p.m_teamId]) || '#fff'}"></div>`;
                const shortName = isPlayer ? 'YOU' : extractShortName(p?.m_name);

                return `
                <div class="lb-row ${isPlayer ? 'player' : ''}">
                    <div class="lb-pos">${lap.m_carPosition}</div>
                    ${teamHtml}
                    <div class="lb-name">${shortName}</div>
                    ${tyreHtml}
                    <div class="${gapClass}">${gapText}</div>
                </div>`;
            }).join('');
        }
    </script>
</body>

</html>
